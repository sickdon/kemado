services:
  web:
    image: nginx:alpine
    container_name: kemado-prototipi
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"   # solo localhost: lo raggiunge cloudflared, non internet
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./sites:/usr/share/nginx/html:ro
