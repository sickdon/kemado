# Un solo nginx, tre host. Il tunnel cloudflared punta tutto qui; nginx smista in base all'Host.
gzip on;
gzip_types text/html text/css application/javascript;

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name kemadoproposta1.ddsconsulting.xyz;
    root /usr/share/nginx/html/proposta1;
    index index.html;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "no-cache" always;
    location / { try_files $uri $uri/ =404; }
}

